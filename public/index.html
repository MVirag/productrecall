<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tilbagekald Alert</title>
  <script>try{var t=JSON.parse(localStorage.getItem("tilbagekald.settings.v1")||"{}").theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="description" content="Besked på telefonen når Fødevarestyrelsen tilbagekalder fødevarer.">
  <meta name="theme-color" content="#103a2e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14382c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Gå til indhold</a>
  <header class="topbar">
    <span class="brand"><span class="mark" aria-hidden="true"></span><span id="app-name" class="brand-name">Tilbagekald Alert</span></span>
    <nav aria-label="Hovedmenu">
      <a id="nav-feed" href="#/">Tilbagekald</a>
      <a id="nav-settings" href="#/settings">Indstillinger</a>
    </nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">
    <p id="disclaimer" class="small muted"></p>
    <button type="button" id="open-privacy" class="linkbtn"></button>
  </footer>
  <noscript>Appen kræver JavaScript.</noscript>
</body>
</html>
